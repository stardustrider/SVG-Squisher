name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-ubuntu-24.04
            arch: x86_64
            binary: build/svg_squisher
            archive_ext: tar.gz
            cmake_args: ""
          - runner: windows-2025
            platform: windows-2025
            arch: x86_64
            binary: build/Release/svg_squisher.exe
            archive_ext: zip
            cmake_args: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - runner: macos-15
            platform: macos-15
            arch: arm64
            binary: build/svg_squisher
            archive_ext: tar.gz
            cmake_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          - runner: macos-15-intel
            platform: macos-15
            arch: x86_64
            binary: build/svg_squisher
            archive_ext: tar.gz
            cmake_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches the project version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -nE 's/^project\(svg_squisher VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          if [[ -z "$project_version" || "$GITHUB_REF_NAME" != "v$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match CMake project version ${project_version:-<missing>}." >&2
            exit 1
          fi

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DSVG_SQUISHER_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run CTest suite
        run: ctest --test-dir build -C Release --output-on-failure --timeout 30

      - name: Stage and package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "svg-squisher-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "${{ matrix.binary }}" "$root/svg_squisher.exe"
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination $root
          New-Item -ItemType Directory -Force -Path "$root/third_party" | Out-Null
          Copy-Item third_party/licenses -Destination "$root/third_party/licenses" -Recurse
          Compress-Archive -Path $root -DestinationPath "$root.zip"

      - name: Stage and package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          root="svg-squisher-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$root/third_party"
          cp "${{ matrix.binary }}" "$root/svg_squisher"
          chmod +x "$root/svg_squisher"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$root/"
          cp -R third_party/licenses "$root/third_party/licenses"
          tar -czf "$root.tar.gz" "$root"

      - name: Extract and smoke-test Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "svg-squisher-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}"
          Remove-Item $root -Recurse -Force
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Expand-Archive -Path "$root.zip" -DestinationPath smoke
          $executable = "smoke/$root/svg_squisher.exe"
          $tag = "${{ github.ref_name }}"
          $expectedVersion = $tag.Substring(1)
          $version = & $executable --version
          if ($version -notmatch [regex]::Escape($expectedVersion)) {
            throw "Extracted executable reported an unexpected version: $version"
          }
          & $executable tests/visual/fixtures/implicit-moveto.svg smoke/result.svg --strict --precision 6
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path smoke/result.svg -Pattern '<path ' -SimpleMatch -Quiet)) {
            throw "Extracted executable did not produce the expected path output."
          }

      - name: Extract and smoke-test Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          root="svg-squisher-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}"
          rm -rf "$root" smoke
          mkdir smoke
          tar -xzf "$root.tar.gz" -C smoke
          executable="smoke/$root/svg_squisher"
          "$executable" --version | grep -F "${GITHUB_REF_NAME#v}"
          "$executable" tests/visual/fixtures/implicit-moveto.svg smoke/result.svg --strict --precision 6
          grep -Fq '<path ' smoke/result.svg

      - name: Upload tested archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svg-squisher-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: svg-squisher-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: package
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download tested archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: svg-squisher-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum svg-squisher-* > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/svg-squisher-*
            release-assets/SHA256SUMS.txt
